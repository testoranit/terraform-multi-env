name: Terraform CI/CD

on:
  push:
    branches:
      - dev
      - qa
      - prod
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'qa' || 'dev' }}
    env:
      TF_LOG: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Determine environment directory
        id: env
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          if [[ "$BRANCH_NAME" == "dev" ]]; then
            echo "env_dir=environments/dev" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "qa" ]]; then
            echo "env_dir=environments/qa" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "prod" ]]; then
            echo "env_dir=environments/prod" >> $GITHUB_OUTPUT
          else
            echo "Unsupported branch: $BRANCH_NAME"
            exit 1

      - name: Terraform Init
        run: terraform -chdir=${{ steps.env.outputs.env_dir }} init

      - name: Terraform Plan
        run: terraform -chdir=${{ steps.env.outputs.env_dir }} plan -out=tfplan

      - name: Terraform Apply (Dev Only)
        if: github.ref == 'refs/heads/dev'
        run: terraform -chdir=${{ steps.env.outputs.env_dir }} apply -auto-approve tfplan

      - name: Terraform Apply (QA and Prod with Approval)
        if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/prod'
        run: terraform -chdir=${{ steps.env.outputs.env_dir }} apply -auto-approve tfplan
